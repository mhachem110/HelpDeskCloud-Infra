name: Terraform Dev Apply

on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch waits rather than overlapping a Dev deployment.
concurrency:
  group: terraform-dev-network-apply
  cancel-in-progress: false

jobs:
  review-plan:
    name: Show Dev plan
    if: github.repository == 'mhachem110/HelpDeskCloud-Infra' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verify trusted repository and branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = "mhachem110/HelpDeskCloud-Infra"
          test "$REF" = "refs/heads/dev"

      - name: Authenticate with existing Dev OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Initialize Dev remote state
        run: terraform init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      # Terraform displays the plan in this job's log. The saved copy stays on this runner.
      - name: Display and check review plan
        run: |
          set -euo pipefail
          umask 077
          plan_file="$RUNNER_TEMP/dev-network-review.tfplan"
          json_file="$RUNNER_TEMP/dev-network-review.json"
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
          terraform show -json "$plan_file" > "$json_file"
          python ../scripts/dev_network_guard.py check-plan "$json_file"

  approved-apply:
    name: Approved Dev apply and verification
    needs: review-plan
    if: github.repository == 'mhachem110/HelpDeskCloud-Infra' && github.ref == 'refs/heads/dev'
    environment: dev-network-apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4.2.2

      # GitHub creates unknown environment names without protections. Fail before OIDC.
      - name: Verify trusted ref and protected environment
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "mhachem110/HelpDeskCloud-Infra"
          test "$REF" = "refs/heads/dev"
          command -v jq >/dev/null
          environment_file="$RUNNER_TEMP/dev-environment.json"
          branches_file="$RUNNER_TEMP/dev-branches.json"
          url="https://api.github.com/repos/mhachem110/HelpDeskCloud-Infra/environments/dev-network-apply"
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' "$url" > "$environment_file"
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' "$url/deployment-branch-policies?per_page=100" > "$branches_file"
          jq -e '.name == "dev-network-apply" and .deployment_branch_policy.custom_branch_policies == true and ([.protection_rules[]? | select(.type == "required_reviewers" and (.reviewers | length) > 0)] | length) > 0' "$environment_file" >/dev/null
          jq -e '.total_count == 1 and (.branch_policies | length) == 1 and .branch_policies[0].name == "dev"' "$branches_file" >/dev/null
          echo 'Required reviewers and dev-only environment branch policy verified.'

      - name: Reauthenticate with existing Dev OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Reinitialize Dev remote state
        run: terraform init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      # This is a new plan after approval; it is never uploaded or committed.
      - name: Check saved apply plan
        id: inspect
        run: |
          set -euo pipefail
          umask 077
          plan_file="$RUNNER_TEMP/dev-network-apply.tfplan"
          json_file="$RUNNER_TEMP/dev-network-apply.json"
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
          terraform show -json "$plan_file" > "$json_file"
          decision=$(python ../scripts/dev_network_guard.py check-plan "$json_file")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "Guard decision: $decision"

      - name: Apply only the checked saved plan
        if: steps.inspect.outputs.decision == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/dev-network-apply.tfplan"

      - name: Report an already deployed network
        if: steps.inspect.outputs.decision == 'no_changes'
        run: echo 'The fresh Dev plan has no changes; apply was skipped.'

      - name: Install gcloud for read-only verification
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployed Dev network and state
        run: |
          set -euo pipefail
          umask 077
          gcloud compute networks describe helpdeskcloud-dev-vpc --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/vpc.json"
          gcloud compute networks subnets describe helpdeskcloud-dev-subnet --region=us-east1 --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/subnet.json"
          gcloud compute addresses describe helpdeskcloud-dev-psa --global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/psa.json"
          gcloud services vpc-peerings list --network=helpdeskcloud-dev-vpc --service=servicenetworking.googleapis.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/connections.json"
          terraform state list > "$RUNNER_TEMP/state-addresses.txt"
          terraform output -json > "$RUNNER_TEMP/outputs.json"
          python ../scripts/dev_network_guard.py verify-deployment \
            "$RUNNER_TEMP/vpc.json" "$RUNNER_TEMP/subnet.json" "$RUNNER_TEMP/psa.json" \
            "$RUNNER_TEMP/connections.json" "$RUNNER_TEMP/outputs.json" "$RUNNER_TEMP/state-addresses.txt"
