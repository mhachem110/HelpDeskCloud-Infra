name: Terraform Dev Apply

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform Infrastructure (core), HTTPS & Certificates (https-foundation), or Identity & Access (https-access). Values are the existing root and state identifiers.
        required: true
        type: choice
        default: core
        options: [core, https-foundation, https-access]

permissions:
  contents: read

# A second dispatch waits rather than overlapping a Dev deployment.
concurrency:
  group: terraform-dev-network-apply
  cancel-in-progress: false

jobs:
  # Review a fresh plan first; the separate protected job below applies only after its checks pass.
  review-plan:
    name: Plan Platform Infrastructure (core)
    if: github.repository == 'mhachem110/HelpDeskCloud-Infra' && github.ref == 'refs/heads/dev' && inputs.target == 'core'
    outputs:
      drift_fingerprint: ${{ steps.reviewed-drift.outputs.fingerprint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Summarize selected Terraform root
        env:
          TARGET: ${{ inputs.target }}
        run: bash ../scripts/terraform_target_summary.sh "$TARGET" Plan

      - name: Verify trusted repository and branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = "mhachem110/HelpDeskCloud-Infra"
          test "$REF" = "refs/heads/dev"

      - name: Authenticate with existing Dev OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Install gcloud for read-only API checks
        uses: google-github-actions/setup-gcloud@v3

      - name: Require existing Dev APIs
        run: |
          set -euo pipefail
          enabled=$(gcloud services list --enabled --project=helpdeskcloud-capstone-511905 --format='value(config.name)')
          for service in compute.googleapis.com servicenetworking.googleapis.com artifactregistry.googleapis.com sqladmin.googleapis.com container.googleapis.com iam.googleapis.com secretmanager.googleapis.com; do
            if ! grep -Fxq "$service" <<< "$enabled"; then
              echo "::error::Required API $service is not enabled. No API was changed."
              exit 1
            fi
          done
          echo 'All seven required APIs are enabled.'

      - name: Check project IAM for direct public access
        run: |
          set -euo pipefail
          umask 077
          gcloud projects get-iam-policy helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/project-iam.json"
          python ../scripts/dev_infra_guard.py check-project-iam "$RUNNER_TEMP/project-iam.json"

      - name: Initialize Dev remote state
        run: terraform init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      # Terraform displays the plan in this job's log. The saved copy stays on this runner.
      - name: Display and check review plan
        id: reviewed-plan
        run: |
          set -euo pipefail
          umask 077
          plan_file="$RUNNER_TEMP/dev-infra-review.tfplan"
          json_file="$RUNNER_TEMP/dev-infra-review.json"
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
          terraform show -json "$plan_file" > "$json_file"
          gcloud secrets get-iam-policy helpdesk-dev-db-connection --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-secret-iam.json"
          gcloud secrets get-iam-policy helpdesk-dev-db-admin-password --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/admin-secret-iam.json"
          python ../scripts/dev_infra_guard.py diagnose-drift "$json_file"
          python ../scripts/dev_infra_guard.py check-plan "$json_file" \
            "$RUNNER_TEMP/app-secret-iam.json" "$RUNNER_TEMP/admin-secret-iam.json" \
            --report-drift

      - name: Record reviewable drift fingerprint
        id: reviewed-drift
        run: |
          set -euo pipefail
          fingerprint=$(python ../scripts/dev_infra_guard.py review-drift "$RUNNER_TEMP/dev-infra-review.json")
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if [[ -n "$fingerprint" ]]; then
            echo "Drift fingerprint: \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
            echo 'The protected Apply will accept only this same fingerprint after its reviewer approves this deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No Terraform resource drift was observed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  approved-apply:
    name: Apply Platform Infrastructure (core)
    needs: review-plan
    if: >-
      always() &&
      github.repository == 'mhachem110/HelpDeskCloud-Infra' &&
      github.ref == 'refs/heads/dev' &&
      inputs.target == 'core' &&
      needs.review-plan.result == 'success'
    environment: dev-network-apply
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      REVIEWED_DRIFT_FINGERPRINT: ${{ needs.review-plan.outputs.drift_fingerprint }}
    steps:
      - uses: actions/checkout@v4.2.2

      # GitHub creates unknown environment names without protections. Fail before OIDC.
      - name: Verify trusted ref and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-network-apply
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: bash ../scripts/verify_dev_environment.sh

      - name: Summarize selected Terraform root
        env:
          TARGET: ${{ inputs.target }}
        run: bash ../scripts/terraform_target_summary.sh "$TARGET" Apply

      - name: Reauthenticate with existing Dev OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install gcloud for read-only checks
        uses: google-github-actions/setup-gcloud@v3

      - name: Check project IAM for direct public access
        run: |
          set -euo pipefail
          umask 077
          gcloud projects get-iam-policy helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/project-iam.json"
          python ../scripts/dev_infra_guard.py check-project-iam "$RUNNER_TEMP/project-iam.json"

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Reinitialize Dev remote state
        run: terraform init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      # This is a new plan after approval; it is never uploaded or committed.
      - name: Check saved apply plan
        id: inspect
        run: |
          set -euo pipefail
          umask 077
          plan_file="$RUNNER_TEMP/dev-infra-apply.tfplan"
          json_file="$RUNNER_TEMP/dev-infra-apply.json"
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
          terraform show -json "$plan_file" > "$json_file"
          gcloud secrets get-iam-policy helpdesk-dev-db-connection --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-secret-iam.json"
          gcloud secrets get-iam-policy helpdesk-dev-db-admin-password --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/admin-secret-iam.json"
          python ../scripts/dev_infra_guard.py diagnose-drift "$json_file"
          current_fingerprint=$(python ../scripts/dev_infra_guard.py review-drift "$json_file")
          if [[ "$current_fingerprint" != "$REVIEWED_DRIFT_FINGERPRINT" ]]; then
            echo '::error::Terraform drift changed after the review plan. Rerun Apply and inspect the new plan before approval.'
            exit 1
          fi
          if [[ -n "$current_fingerprint" ]]; then
            decision=$(python ../scripts/dev_infra_guard.py check-plan "$json_file" \
              "$RUNNER_TEMP/app-secret-iam.json" "$RUNNER_TEMP/admin-secret-iam.json" \
              --acknowledged-drift "$current_fingerprint")
          else
            decision=$(python ../scripts/dev_infra_guard.py check-plan "$json_file" \
              "$RUNNER_TEMP/app-secret-iam.json" "$RUNNER_TEMP/admin-secret-iam.json")
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "Guard decision: $decision"

      - name: Apply only the checked saved plan
        if: steps.inspect.outputs.decision == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/dev-infra-apply.tfplan"

      - name: Report already deployed Dev infrastructure
        if: steps.inspect.outputs.decision == 'no_changes'
        run: echo 'The fresh Dev plan has no changes; apply was skipped.'

      - name: Verify deployed Dev infrastructure and state
        run: |
          set -euo pipefail
          umask 077
          gcloud compute networks describe helpdeskcloud-dev-vpc --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/vpc.json"
          gcloud compute networks subnets describe helpdeskcloud-dev-subnet --region=us-east1 --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/subnet.json"
          gcloud compute addresses describe helpdeskcloud-dev-psa --global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/psa.json"
          gcloud services vpc-peerings list --network=helpdeskcloud-dev-vpc --service=servicenetworking.googleapis.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/connections.json"
          gcloud artifacts repositories describe helpdeskcloud-dev-images --location=us-east1 --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/registry.json"
          gcloud artifacts repositories get-iam-policy helpdeskcloud-dev-images --location=us-east1 --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/registry-iam.json"
          gcloud projects get-iam-policy helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/project-iam.json"
          gcloud sql instances describe helpdeskcloud-dev-postgres --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/sql.json"
          gcloud sql databases list --instance=helpdeskcloud-dev-postgres --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/databases.json"
          gcloud container clusters describe helpdeskcloud-dev-gke --region=us-east1 --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/cluster.json"
          gcloud iam service-accounts describe helpdesk-gke-node-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/node-sa.json"
          gcloud iam service-accounts describe helpdesk-app-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-sa.json"
          gcloud iam service-accounts describe helpdesk-migrate-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/migration-sa.json"
          gcloud secrets describe helpdesk-dev-db-connection --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-secret.json"
          gcloud secrets describe helpdesk-dev-db-admin-password --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/admin-secret.json"
          gcloud iam service-accounts get-iam-policy helpdesk-app-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-sa-iam.json"
          gcloud iam service-accounts get-iam-policy helpdesk-migrate-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/migration-sa-iam.json"
          gcloud secrets get-iam-policy helpdesk-dev-db-connection --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-secret-iam.json"
          gcloud secrets get-iam-policy helpdesk-dev-db-admin-password --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/admin-secret-iam.json"
          gcloud iam service-accounts describe helpdesk-app-support-pub-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/support-image-publisher-sa.json"
          gcloud iam service-accounts get-iam-policy helpdesk-app-support-pub-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/support-image-publisher-sa-iam.json"
          gcloud iam workload-identity-pools providers describe github-app-support-images-dev --workload-identity-pool=helpdesk-github --location=global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/support-image-provider.json"
          gcloud iam service-accounts describe helpdesk-app-migr-runner-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/migration-runner-sa.json"
          gcloud iam service-accounts get-iam-policy helpdesk-app-migr-runner-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/migration-runner-sa-iam.json"
          gcloud iam workload-identity-pools providers describe github-app-migration-dev --workload-identity-pool=helpdesk-github --location=global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/migration-runner-provider.json"
          gcloud iam service-accounts describe helpdesk-app-publisher-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-publisher-sa.json"
          gcloud iam service-accounts get-iam-policy helpdesk-app-publisher-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-publisher-sa-iam.json"
          gcloud iam workload-identity-pools providers describe github-app-publish-dev --workload-identity-pool=helpdesk-github --location=global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-publisher-provider.json"
          gcloud iam service-accounts describe helpdesk-app-deployer-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-deployer-sa.json"
          gcloud iam service-accounts get-iam-policy helpdesk-app-deployer-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-deployer-sa-iam.json"
          gcloud iam workload-identity-pools providers describe github-app-deploy-dev --workload-identity-pool=helpdesk-github --location=global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/app-deployer-provider.json"
          terraform state list > "$RUNNER_TEMP/state-addresses.txt"
          terraform output -json > "$RUNNER_TEMP/outputs.json"
          terraform show -json > "$RUNNER_TEMP/state.json"
          python ../scripts/dev_infra_guard.py verify-deployment \
            "$RUNNER_TEMP/vpc.json" "$RUNNER_TEMP/subnet.json" "$RUNNER_TEMP/psa.json" \
            "$RUNNER_TEMP/connections.json" "$RUNNER_TEMP/registry.json" "$RUNNER_TEMP/registry-iam.json" \
            "$RUNNER_TEMP/project-iam.json" "$RUNNER_TEMP/sql.json" "$RUNNER_TEMP/databases.json" \
            "$RUNNER_TEMP/outputs.json" "$RUNNER_TEMP/cluster.json" \
            "$RUNNER_TEMP/node-sa.json" "$RUNNER_TEMP/app-sa.json" "$RUNNER_TEMP/migration-sa.json" \
            "$RUNNER_TEMP/app-secret.json" "$RUNNER_TEMP/admin-secret.json" \
            "$RUNNER_TEMP/app-sa-iam.json" "$RUNNER_TEMP/migration-sa-iam.json" \
            "$RUNNER_TEMP/app-secret-iam.json" "$RUNNER_TEMP/admin-secret-iam.json" \
            "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/support-image-publisher-sa.json" \
            "$RUNNER_TEMP/support-image-publisher-sa-iam.json" "$RUNNER_TEMP/support-image-provider.json" \
            "$RUNNER_TEMP/migration-runner-sa.json" "$RUNNER_TEMP/migration-runner-sa-iam.json" \
            "$RUNNER_TEMP/migration-runner-provider.json" "$RUNNER_TEMP/app-publisher-sa.json" \
            "$RUNNER_TEMP/app-publisher-sa-iam.json" "$RUNNER_TEMP/app-publisher-provider.json" \
            "$RUNNER_TEMP/app-deployer-sa.json" "$RUNNER_TEMP/app-deployer-sa-iam.json" \
            "$RUNNER_TEMP/app-deployer-provider.json" \
            "$RUNNER_TEMP/state-addresses.txt"

  review-https-plan:
    name: Plan ${{ inputs.target == 'https-foundation' && 'HTTPS & Certificates (https-foundation)' || 'Identity & Access (https-access)' }}
    if: github.repository == 'mhachem110/HelpDeskCloud-Infra' && github.ref == 'refs/heads/dev' && inputs.target != 'core'
    outputs:
      ready: ${{ steps.prepare-target.outputs.ready }}
      hostname: ${{ steps.prepare-target.outputs.hostname }}
      backend_service_name: ${{ steps.prepare-target.outputs.backend_service_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      COMPONENT: ${{ inputs.target }}
      IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Summarize selected Terraform root
        env:
          TARGET: ${{ inputs.target }}
        run: bash ../scripts/terraform_target_summary.sh "$TARGET" Plan

      - name: Verify trusted repository and branch
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = "mhachem110/HelpDeskCloud-Infra"
          test "$REF" = "refs/heads/dev"

      - name: Validate selected Terraform target
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            https-foundation) test -f https-foundation/environments/dev.tfvars ;;
            https-access) : ;;
            *) echo '::error::Unknown HTTPS component.'; exit 1 ;;
          esac

      - name: Authenticate with the existing Dev OIDC provider
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install GKE access tools
        if: inputs.target == 'https-access'
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl,gke-gcloud-auth-plugin

      - name: Report one-time HTTPS API bootstrap prerequisite
        if: inputs.target == 'https-foundation'
        run: |
          echo 'Certificate Manager and IAP must be enabled once by a project administrator before Apply.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run: `gcloud services enable certificatemanager.googleapis.com iap.googleapis.com --project=helpdeskcloud-capstone-511905`' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare selected HTTPS target
        id: prepare-target
        env:
          COMPONENT: ${{ inputs.target }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
        run: bash ../scripts/prepare_dev_https_target.sh

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Initialize the selected isolated HTTPS state
        if: steps.prepare-target.outputs.ready == 'true'
        run: terraform -chdir="$COMPONENT" init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      - name: Display and check review plan
        if: steps.prepare-target.outputs.ready == 'true'
        env:
          HTTPS_HOSTNAME: ${{ steps.prepare-target.outputs.hostname }}
          IAP_BACKEND_SERVICE_NAME: ${{ steps.prepare-target.outputs.backend_service_name }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$COMPONENT" == 'https-foundation' ]]; then
            plan_file="$RUNNER_TEMP/dev-https-foundation-review.tfplan"
            json_file="$RUNNER_TEMP/dev-https-foundation-review.json"
            terraform -chdir="$COMPONENT" plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
            terraform -chdir="$COMPONENT" show -json "$plan_file" > "$json_file"
            python ../scripts/dev_https_guard.py check-foundation "$json_file" --hostname "$HTTPS_HOSTNAME"
          else
            plan_file="$RUNNER_TEMP/dev-https-access-review.tfplan"
            json_file="$RUNNER_TEMP/dev-https-access-review.json"
            terraform -chdir="$COMPONENT" plan -input=false -no-color -lock-timeout=5m \
              -var="backend_service_name=$IAP_BACKEND_SERVICE_NAME" -var="allowed_email=$IAP_ALLOWED_EMAIL" -out="$plan_file"
            terraform -chdir="$COMPONENT" show -json "$plan_file" > "$json_file"
            python ../scripts/dev_https_guard.py check-access "$json_file" \
              --backend-service-name "$IAP_BACKEND_SERVICE_NAME" --allowed-email "$IAP_ALLOWED_EMAIL"
          fi

  approved-https-apply:
    name: Apply ${{ inputs.target == 'https-foundation' && 'HTTPS & Certificates (https-foundation)' || 'Identity & Access (https-access)' }}
    needs: review-https-plan
    if: github.repository == 'mhachem110/HelpDeskCloud-Infra' && github.ref == 'refs/heads/dev' && inputs.target != 'core' && needs.review-https-plan.result == 'success' && needs.review-https-plan.outputs.ready == 'true'
    environment: dev-network-apply
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      COMPONENT: ${{ inputs.target }}
      IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
      REVIEWED_HTTPS_HOSTNAME: ${{ needs.review-https-plan.outputs.hostname }}
      REVIEWED_BACKEND_SERVICE_NAME: ${{ needs.review-https-plan.outputs.backend_service_name }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verify trusted ref and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT: dev-network-apply
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: bash ../scripts/verify_dev_environment.sh

      - name: Summarize selected Terraform root
        env:
          TARGET: ${{ inputs.target }}
        run: bash ../scripts/terraform_target_summary.sh "$TARGET" Apply

      - name: Reauthenticate with existing Dev OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install gcloud for HTTPS resource checks
        if: inputs.target == 'https-foundation'
        uses: google-github-actions/setup-gcloud@v3

      - name: Install GKE access tools for backend discovery
        if: inputs.target == 'https-access'
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl,gke-gcloud-auth-plugin

      - name: Install Terraform 1.16.2
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Revalidate selected HTTPS target after approval
        id: prepare-target
        env:
          COMPONENT: ${{ inputs.target }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          bash ../scripts/prepare_dev_https_target.sh
          if [[ "$COMPONENT" == 'https-foundation' ]]; then
            test "$(sed -n 's/^hostname=//p' "$GITHUB_OUTPUT")" = "$REVIEWED_HTTPS_HOSTNAME"
          else
            test "$(sed -n 's/^backend_service_name=//p' "$GITHUB_OUTPUT")" = "$REVIEWED_BACKEND_SERVICE_NAME"
          fi

      - name: Initialize the selected isolated HTTPS state
        if: steps.prepare-target.outputs.ready == 'true'
        run: terraform -chdir="$COMPONENT" init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      - name: Create a fresh guarded apply plan
        id: inspect-https
        if: steps.prepare-target.outputs.ready == 'true'
        env:
          HTTPS_HOSTNAME: ${{ steps.prepare-target.outputs.hostname }}
          IAP_BACKEND_SERVICE_NAME: ${{ steps.prepare-target.outputs.backend_service_name }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          plan_file="$RUNNER_TEMP/dev-${COMPONENT}-apply.tfplan"
          if [[ "$COMPONENT" == 'https-foundation' ]]; then
            json_file="$RUNNER_TEMP/dev-https-foundation-apply.json"
            terraform -chdir="$COMPONENT" plan -input=false -no-color -lock-timeout=5m -var-file=environments/dev.tfvars -out="$plan_file"
            terraform -chdir="$COMPONENT" show -json "$plan_file" > "$json_file"
            python ../scripts/dev_https_guard.py check-foundation "$json_file" --hostname "$HTTPS_HOSTNAME"
          else
            json_file="$RUNNER_TEMP/dev-https-access-apply.json"
            terraform -chdir="$COMPONENT" plan -input=false -no-color -lock-timeout=5m \
              -var="backend_service_name=$IAP_BACKEND_SERVICE_NAME" -var="allowed_email=$IAP_ALLOWED_EMAIL" -out="$plan_file"
            terraform -chdir="$COMPONENT" show -json "$plan_file" > "$json_file"
            python ../scripts/dev_https_guard.py check-access "$json_file" \
              --backend-service-name "$IAP_BACKEND_SERVICE_NAME" --allowed-email "$IAP_ALLOWED_EMAIL"
          fi
          if jq -e '[.resource_changes[]? | select(.mode == "managed") | select(.change.actions != ["no-op"])] | length == 0' "$json_file" >/dev/null; then
            echo 'decision=no_changes' >> "$GITHUB_OUTPUT"
          else
            echo 'decision=apply' >> "$GITHUB_OUTPUT"
          fi
          echo "plan_file=$plan_file" >> "$GITHUB_OUTPUT"
          echo "Guarded HTTPS plan decision: $(tail -n 1 "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Apply only the fresh guarded plan
        if: steps.inspect-https.outputs.decision == 'apply'
        env:
          PLAN_FILE: ${{ steps.inspect-https.outputs.plan_file }}
        run: terraform -chdir="$COMPONENT" apply -input=false -no-color -lock-timeout=5m "$PLAN_FILE"

      - name: Report unchanged HTTPS resources
        if: steps.inspect-https.outputs.decision == 'no_changes'
        run: echo 'The fresh isolated HTTPS plan has no changes; apply was skipped.'

      - name: Verify retained HTTPS foundation and report DNS authorization
        if: inputs.target == 'https-foundation'
        env:
          HTTPS_HOSTNAME: ${{ steps.prepare-target.outputs.hostname }}
        run: |
          set -euo pipefail
          umask 077
          describe_with_retry() {
            local label="$1"
            local output_file="$2"
            local error_file="${output_file}.stderr"
            local attempt=1
            local command_status=1
            shift 2

            while (( attempt <= 3 )); do
              if "$@" --format=json > "$output_file" 2> "$error_file"; then
                rm -f "$error_file"
                return 0
              else
                command_status=$?
              fi

              if grep -Eiq 'NOT_FOUND|not found|404' "$error_file" && (( attempt < 3 )); then
                echo "Retrying $label read after propagation delay (attempt $attempt of 3)." >&2
                sleep 2
              else
                echo "::error::$label read failed after attempt $attempt (exit $command_status)." >&2
                cat "$error_file" >&2
                return "$command_status"
              fi
              attempt=$((attempt + 1))
            done
          }

          describe_with_retry 'GCP project identity' "$RUNNER_TEMP/https-project.json" \
            gcloud projects describe helpdeskcloud-capstone-511905
          describe_with_retry 'reserved HTTPS address' "$RUNNER_TEMP/https-address.json" \
            gcloud compute addresses describe helpdesk-dev-https-ip --global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'HTTPS SSL policy' "$RUNNER_TEMP/https-ssl-policy.json" \
            gcloud compute ssl-policies describe helpdesk-dev-https-tls --project=helpdeskcloud-capstone-511905
          describe_with_retry 'Retained legacy Certificate Manager DNS authorization' "$RUNNER_TEMP/https-legacy-dns-auth.json" \
            gcloud certificate-manager dns-authorizations describe helpdesk-dev-https-dns-auth --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'Retained legacy managed HTTPS certificate' "$RUNNER_TEMP/https-legacy-certificate.json" \
            gcloud certificate-manager certificates describe helpdesk-dev-https-certificate --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'New dynv6 Certificate Manager DNS authorization' "$RUNNER_TEMP/https-dynv6-dns-auth.json" \
            gcloud certificate-manager dns-authorizations describe helpdesk-dev-https-dynv6-dns-auth --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'New dynv6 managed HTTPS certificate' "$RUNNER_TEMP/https-dynv6-certificate.json" \
            gcloud certificate-manager certificates describe helpdesk-dev-https-dynv6-certificate --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'HTTPS certificate map' "$RUNNER_TEMP/https-certificate-map.json" \
            gcloud certificate-manager maps describe helpdesk-dev-https-map --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'Retained legacy HTTPS certificate map entry' "$RUNNER_TEMP/https-legacy-certificate-map-entry.json" \
            gcloud certificate-manager maps entries describe helpdesk-dev-https-host --map=helpdesk-dev-https-map --location=global --project=helpdeskcloud-capstone-511905
          describe_with_retry 'New dynv6 HTTPS certificate map entry' "$RUNNER_TEMP/https-dynv6-certificate-map-entry.json" \
            gcloud certificate-manager maps entries describe helpdesk-dev-https-dynv6-host --map=helpdesk-dev-https-map --location=global --project=helpdeskcloud-capstone-511905

          terraform -chdir=https-foundation state pull > "$RUNNER_TEMP/https-foundation-state.json"
          python ../scripts/dev_https_verify_foundation.py \
            --project-file "$RUNNER_TEMP/https-project.json" \
            --address-file "$RUNNER_TEMP/https-address.json" \
            --ssl-policy-file "$RUNNER_TEMP/https-ssl-policy.json" \
            --legacy-dns-authorization-file "$RUNNER_TEMP/https-legacy-dns-auth.json" \
            --legacy-certificate-file "$RUNNER_TEMP/https-legacy-certificate.json" \
            --legacy-map-entry-file "$RUNNER_TEMP/https-legacy-certificate-map-entry.json" \
            --dns-authorization-file "$RUNNER_TEMP/https-dynv6-dns-auth.json" \
            --certificate-file "$RUNNER_TEMP/https-dynv6-certificate.json" \
            --certificate-map-file "$RUNNER_TEMP/https-certificate-map.json" \
            --map-entry-file "$RUNNER_TEMP/https-dynv6-certificate-map-entry.json" \
            --terraform-state-file "$RUNNER_TEMP/https-foundation-state.json" \
            --project-id helpdeskcloud-capstone-511905 \
            --hostname "$HTTPS_HOSTNAME" \
            --expected-ip 34.8.56.208 \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Verify the exact IAP backend user grant
        if: inputs.target == 'https-access'
        env:
          IAP_BACKEND_SERVICE_NAME: ${{ steps.prepare-target.outputs.backend_service_name }}
          IAP_ALLOWED_EMAIL: ${{ vars.DEV_IAP_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          gcloud compute backend-services describe "$IAP_BACKEND_SERVICE_NAME" --global --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/https-backend.json"
          gcloud iap web get-iam-policy --resource-type=backend-services --service="$IAP_BACKEND_SERVICE_NAME" --project=helpdeskcloud-capstone-511905 --format=json > "$RUNNER_TEMP/https-iap-policy.json"
          jq -e '.id | tostring | test("^[0-9]+$")' "$RUNNER_TEMP/https-backend.json" >/dev/null
          python ../scripts/dev_https_guard.py verify-access-policy "$RUNNER_TEMP/https-iap-policy.json" --allowed-email "$IAP_ALLOWED_EMAIL"
          backend_id=$(jq -r '.id' "$RUNNER_TEMP/https-backend.json")
          echo "Exact IAP user grant verified on global backend ${IAP_BACKEND_SERVICE_NAME}." >> "$GITHUB_STEP_SUMMARY"
          echo "Set App repository variable DEV_IAP_BACKEND_SERVICE_ID=${backend_id} and DEV_IAP_ALLOWED_EMAIL to the same account before a protected app rollout." >> "$GITHUB_STEP_SUMMARY"
