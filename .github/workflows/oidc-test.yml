
name: GCP OIDC Authentication Test

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/oidc-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gcp-oidc:
    name: Verify GCP OIDC and Terraform State Access
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify active service account
        run: gcloud auth list

      - name: Verify Terraform state bucket access
        run: gcloud storage ls gs://helpdeskcloud-tfstate-511905/

      - name: Authentication successful
        run: echo "GitHub OIDC authentication and state bucket access succeeded."
