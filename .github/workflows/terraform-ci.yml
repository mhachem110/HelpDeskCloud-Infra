name: Terraform CI

# Run validation on proposed and promoted changes; this workflow never authenticates to GCP.
on:
  pull_request:
    branches: [dev, stage, prod]

# CI jobs only need to read the repository; cloud identities are never granted here.
permissions:
  contents: read

# Each job checks a different repository invariant and runs independently on pull requests.
jobs:
  # Enforce feature/Codex -> dev -> stage -> prod promotion before other checks run.
  promotion-route:
    name: Check promotion route
    runs-on: ubuntu-latest
    steps:
      - name: Require the agreed source and target branches
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          # Dev accepts maintained feature and Codex branches; Stage and Prod follow the release chain.
          if [[ "$TARGET" == "dev" && ( "$SOURCE" == feature/* || "$SOURCE" == codex/* ) ]] ||
             [[ "$TARGET" == "stage" && "$SOURCE" == "dev" ]] ||
             [[ "$TARGET" == "prod" && "$SOURCE" == "stage" ]]; then
            echo "Allowed promotion route: $SOURCE -> $TARGET"
          else
            echo "Disallowed promotion route: $SOURCE -> $TARGET" >&2
            exit 1
          fi

  # Format and validate the core and isolated HTTPS roots without initializing remote state.
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without GCS access
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Validate isolated HTTPS Terraform roots
        run: |
          set -euo pipefail
          for root in https-foundation https-access; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate -no-color
          done

  # Apply Terraform-specific static analysis to every root.
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.64.0
      - name: Lint Terraform
        run: |
          set -euo pipefail
          tflint --format compact
          for root in https-foundation https-access; do
            (cd "$root" && tflint --format compact)
          done

  # Scan Terraform resources for security misconfiguration.
  checkov:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.17
      - name: Scan Terraform configuration
        run: checkov --directory terraform --framework terraform --quiet

  # Check helper syntax and the policy tests that protect future Dev Apply runs.
  apply-guard-tests:
    name: Dev Apply guard tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Validate HTTPS target helper shell syntax
        run: |
          set -euo pipefail
          for script in scripts/prepare_dev_https_target.sh scripts/prepare_dev_https_access.sh; do
            bash -n "$script"
          done
      - name: Test the Dev infrastructure Apply guard
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
