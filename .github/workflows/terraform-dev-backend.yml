name: Terraform Dev Backend Check

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dev-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-backend:
    name: Authenticate and initialize Dev state
    if: github.ref == 'refs/heads/dev' && github.repository == 'mhachem110/HelpDeskCloud-Infra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      # The existing provider accepts only this repository on refs/heads/dev.
      - name: Authenticate with the existing Dev OIDC provider
        uses: google-github-actions/auth@v3
        with:
          project_id: helpdeskcloud-capstone-511905
          workload_identity_provider: projects/260283083469/locations/global/workloadIdentityPools/helpdesk-github/providers/github-infra-dev
          service_account: helpdesk-terraform-dev@helpdeskcloud-capstone-511905.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.2

      - name: Initialize the Dev GCS backend
        run: terraform init -input=false -no-color -lockfile=readonly -backend-config=environments/dev.gcs.tfbackend

      - name: Validate initialized configuration
        run: terraform validate -no-color

      - name: Report backend connection
        run: echo "Dev GCS backend initialization and Terraform validation succeeded."
